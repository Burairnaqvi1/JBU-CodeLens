<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    JBU CodeLens mark: a stylised </> built from two chevrons and a slash.

    Rebuilt as vector from the supplied concept render, which was a presentation mockup rather
    than an asset. Colours are tied to the application palette: the gradient runs from a teal
    between the app's green accent (#4FC97E) and its primary blue, ending on the primary blue
    itself (#4AA3FF), so the logo belongs to the same family as the UI.

    Deliberately kept to three thick strokes with round joins: it still reads at 16 px, where a
    more literal copy of the glassy 3D concept would turn to mush.

    This file is the source of truth. logo.png and app.ico are generated from it.
  -->
  <defs>
    <linearGradient id="markGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#33E0C4"/>
      <stop offset="55%" stop-color="#2BB6E8"/>
      <stop offset="100%" stop-color="#4AA3FF"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke="url(#markGradient)" stroke-width="46"
     stroke-linecap="round" stroke-linejoin="round">
    <polyline points="196,146 104,256 196,366"/>
    <polyline points="316,146 408,256 316,366"/>
    <line x1="288" y1="128" x2="224" y2="384"/>
  </g>
</svg>
